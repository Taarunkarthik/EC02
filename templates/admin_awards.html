{% extends "base.html" %}

{% block title %}Awards & Citations — Admin Console{% endblock %}

{% block content %}
<div class="container" style="max-width: 1200px; margin-top: 1.5rem;">
  
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
    <div>
      <h2 class="mono text-primary font-bold">&gt; OFFICIAL TOURNAMENT AWARDS</h2>
      <div class="text-muted mono" style="font-size: 0.85rem;">Confer honors and publish ceremony results</div>
    </div>
    <a href="/admin/dashboard" class="btn btn-outline">&larr; Back to Console</a>
  </div>

  <form method="POST" action="/admin/award/save-all">
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 2rem;" class="grid-2">
      
      <!-- Champions -->
      <div class="card" style="border-left: 4px solid var(--primary);">
        <div class="card-header">
          <span class="mono text-primary font-bold">EXIT CODE 0 CHAMPIONS (TOP OVERALL)</span>
        </div>
        <div class="form-group">
          <label class="form-label" for="champion_1">1st Place Grand Winner</label>
          <select id="champion_1" name="champion_1" class="form-control">
            <option value="">-- Select Team --</option>
            {% for t in teams %}
              <option value="{{ t.id }}" {{ 'selected' if current_awards.get('CHAMPION_1') == t.id else '' }}>{{ t.name }} (Score: {{ t.final_score | round(1) }})</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" for="champion_2">2nd Place Runner-Up</label>
          <select id="champion_2" name="champion_2" class="form-control">
            <option value="">-- Select Team --</option>
            {% for t in teams %}
              <option value="{{ t.id }}" {{ 'selected' if current_awards.get('CHAMPION_2') == t.id else '' }}>{{ t.name }} (Score: {{ t.final_score | round(1) }})</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" for="champion_3">3rd Place</label>
          <select id="champion_3" name="champion_3" class="form-control">
            <option value="">-- Select Team --</option>
            {% for t in teams %}
              <option value="{{ t.id }}" {{ 'selected' if current_awards.get('CHAMPION_3') == t.id else '' }}>{{ t.name }} (Score: {{ t.final_score | round(1) }})</option>
            {% endfor %}
          </select>
        </div>
      </div>

      <!-- Special Category Awards -->
      <div class="card" style="border-left: 4px solid var(--warning);">
        <div class="card-header">
          <span class="mono text-warning font-bold">SPECIAL RECOGNITION CITATIONS</span>
        </div>

        <div class="form-group">
          <label class="form-label" for="first_blood">FIRST BLOOD (First to Conquer Boss Level)</label>
          <select id="first_blood" name="first_blood" class="form-control">
            <option value="">-- Select Team --</option>
            {% for t in teams %}
              <option value="{{ t.id }}" {{ 'selected' if current_awards.get('FIRST_BLOOD') == t.id else '' }}>{{ t.name }} ({{ t.id }})</option>
            {% endfor %}
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="peoples_choice">PEOPLE'S CHOICE (Audience Favorite)</label>
          <select id="peoples_choice" name="peoples_choice" class="form-control">
            <option value="">-- Select Team --</option>
            {% for t in teams %}
              <option value="{{ t.id }}" {{ 'selected' if current_awards.get('PEOPLES_CHOICE') == t.id else '' }}>{{ t.name }} ({{ t.id }})</option>
            {% endfor %}
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="rubber_duck_award">RUBBER DUCK AWARD (Best Analogy / Explanation)</label>
          <select id="rubber_duck_award" name="rubber_duck_award" class="form-control">
            <option value="">-- Select Team --</option>
            {% for t in teams %}
              <option value="{{ t.id }}" {{ 'selected' if current_awards.get('RUBBER_DUCK_AWARD') == t.id else '' }}>{{ t.name }} ({{ t.id }})</option>
            {% endfor %}
          </select>
        </div>
      </div>

    </div>

    <div style="display: flex; justify-content: flex-end;">
      <button type="submit" class="btn btn-primary" style="font-size: 1.05rem; padding: 0.85rem 2rem;">
        [ SAVE &amp; PUBLISH OFFICIAL AWARDS ]
      </button>
    </div>
  </form>

</div>
{% endblock %}
